---
layout: default
---
<article>
  <header class="article-head">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a> / {{ page.title }}</nav>
      <h1>{{ page.title }}</h1>
      {%- if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
      {%- if page.updated %}<p class="fine">Last updated {{ page.updated }}</p>{% endif %}
    </div>
  </header>
  <div class="wrap">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
