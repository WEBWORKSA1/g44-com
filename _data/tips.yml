- {text: "Drink a full glass of water at the first hint of a headache. Mild dehydration is one of the most common and easiest triggers to fix.", url: guides/daily-basics.html, link: Daily basics guide}
- {text: "Count your pain-relief days, not just your pills. Ten or more days a month of triptans or combination painkillers, or fifteen of simple painkillers, can start a rebound cycle.", url: tools/rebound-risk.html, link: Check your rebound risk}
- {text: "Keep the same wake-up time on weekends. A lie-in shifts your body clock and is a classic weekend-headache trigger.", url: guides/daily-basics.html, link: Sleep tips}
- {text: "Every 20 minutes at a screen, look at something about 20 feet away for 20 seconds. Your eye and neck muscles will thank you.", url: tools/desk-break.html, link: Start a desk-break timer}
- {text: "Write down the time a headache starts. Patterns in timing, like the same hour every night, are often the biggest clue to the type.", url: tools/headache-diary.html, link: Open the diary}
- {text: "Skipping meals can trigger headaches. A small snack with protein mid-afternoon helps many people.", url: guides/daily-basics.html, link: Daily basics guide}
- {text: "If you cut back on coffee, go slowly. Dropping caffeine suddenly can cause a headache within a day.", url: types/caffeine-withdrawal.html, link: Caffeine-withdrawal headache}
- {text: "A sudden headache that peaks within a minute is an emergency, even if you feel fine afterwards.", url: types/thunderclap.html, link: Thunderclap headache}
- {text: "Raise your screen so the top edge sits at eye level. Looking down for hours loads the neck muscles that feed many headaches.", url: guides/screens-and-desks.html, link: Screens and desks guide}
- {text: "Weather swings can trigger attacks in some people. Check the pressure outlook and plan lighter days around big drops.", url: tools/headache-weather.html, link: Headache weather}
- {text: "Bring a diary to your appointment. Doctors diagnose most headaches from the story, and a written record makes your story clear.", url: tools/visit-prep.html, link: Plan your visit}
- {text: "Slow breathing, about six breaths a minute, calms the stress response that tightens head and neck muscles.", url: tools/breathing.html, link: Try the breathing pacer}
- {text: "Cluster headache attacks often respond to high-flow oxygen prescribed by a doctor. Ask about it if your attacks fit the pattern.", url: types/cluster.html, link: Cluster headache}
- {text: "A new headache that wakes you from sleep, or one that is worse lying down, deserves a doctor's look.", url: tools/red-flags.html, link: Warning-sign checker}
- {text: "Alcohol can trigger cluster attacks during a bout, even in small amounts. Many people avoid it entirely until the bout ends.", url: types/cluster.html, link: Cluster headache}
- {text: "Clenching or grinding your teeth can feed temple and jaw pain. Notice whether your teeth touch when you are concentrating.", url: types/tension-type.html, link: Tension-type headache}
- {text: "Most self-diagnosed sinus headaches meet the criteria for migraine. If decongestants never help, ask about migraine.", url: types/sinus.html, link: Sinus headache}
- {text: "Regular, moderate exercise reduces headache frequency for many people. Warm up gradually if exercise is a trigger for you.", url: types/exertional-and-cough.html, link: Exertional headache}
- {text: "Light sensitivity during attacks? Dim your screen or switch this site to low-light mode with the button at the top.", url: "", link: ""}
- {text: "Headaches that started after a fall, bump or crash should be checked, even weeks later.", url: types/post-traumatic.html, link: Post-traumatic headache}
- {text: "Tell your doctor every medicine and supplement you take. Some, including certain blood-pressure and hormone medicines, can trigger headaches.", url: guides/talk-to-your-doctor.html, link: Talking to your doctor}
- {text: "A headache that started on a date you remember and never stopped has its own name and its own treatment plan.", url: types/new-daily-persistent.html, link: New daily persistent headache}
- {text: "Heat or cold packs on the neck and shoulders can ease a tension-type headache. Try 15 minutes and see which suits you.", url: guides/headache-first-aid.html, link: Headache first aid}
- {text: "Over 50 and getting new nightly headaches? Hypnic headache is one cause, but a check-up comes first.", url: types/hypnic.html, link: Hypnic headache}
- {text: "Gentle neck strengthening, guided by a physiotherapist, helps many people with neck-driven headaches.", url: types/cervicogenic.html, link: Cervicogenic headache}
- {text: "Jabbing pains lasting a second or two are usually harmless, but tell a doctor if they always strike the same spot.", url: types/primary-stabbing.html, link: Primary stabbing headache}
- {text: "Paid research studies are recruiting people with headache disorders now. Some cover travel and pay for your time.", url: get-care.html?need=studies, link: See studies}
- {text: "A headache that is getting steadily worse over weeks needs a medical review.", url: tools/red-flags.html, link: Warning-sign checker}
- {text: "Big swings in caffeine, sleep or meals matter more than any one of them. Aim for steady.", url: guides/daily-basics.html, link: Daily basics guide}
- {text: "Track triggers for at least two months before ruling any in or out. One bad day after chocolate proves nothing.", url: tools/headache-diary.html, link: Open the diary}
