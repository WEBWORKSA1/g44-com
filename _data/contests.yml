# One theme per month, January first. The Contests page picks the current month automatically.
- {title: "The one habit that helped", brief: "Tell us the single daily habit that cut your headache days, and how you stuck with it."}
- {title: "The note I needed", brief: "Write the kind note you wish someone had given you on a bad headache day. 300 words or fewer."}
- {title: "Desk setup makeover", brief: "Share a photo or description of the workspace change that made screen days easier on your head."}
- {title: "Light and sound", brief: "Show us, in a drawing, photo or short poem of your own, how light and sound feel during an attack."}
- {title: "Weather watchers", brief: "Tell us how you plan around weather swings and what actually works."}
- {title: "The travel kit", brief: "List what is in your headache travel kit and why each item earns its place."}
- {title: "Hydration heroes", brief: "Share the trick that finally got you drinking enough water every day."}
- {title: "Headaches at school and work", brief: "Give one practical tip for getting through a school or work day with a headache disorder."}
- {title: "Ask the expert", brief: "Send the headache question you most want answered. Winning questions get a full answer in a G44 guide."}
- {title: "Sleep champions", brief: "Tell us the bedtime or wake-up change that made the biggest difference to your headaches."}
- {title: "Thank you", brief: "Thank someone who helped you through headache days, and tell us what they did. 300 words or fewer."}
- {title: "My year in review", brief: "Share the most useful thing your headache diary taught you this year."}
