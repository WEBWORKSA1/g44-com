# ICD-10-CM category G44 (U.S. clinical modification). Plain-English notes are ours.
# "Intractable" in ICD-10-CM means hard to treat: pharmacoresistant, refractory or poorly controlled.
- cat: G44.0 Cluster headaches and other trigeminal autonomic cephalgias (TAC)
  codes:
