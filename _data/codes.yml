    - {code: G44.009, title: "Cluster headache syndrome, unspecified, not intractable", plain: "Cluster headache, type not stated, responding to treatment.", slug: cluster}
    - {code: G44.011, title: "Episodic cluster headache, intractable", plain: "Cluster bouts with pain-free gaps of 3 months or more, hard to treat.", slug: cluster}
    - {code: G44.019, title: "Episodic cluster headache, not intractable", plain: "Cluster bouts with pain-free gaps of 3 months or more.", slug: cluster}
    - {code: G44.021, title: "Chronic cluster headache, intractable", plain: "Cluster attacks for a year or more with short or no breaks, hard to treat.", slug: cluster}
    - {code: G44.029, title: "Chronic cluster headache, not intractable", plain: "Cluster attacks for a year or more with short or no breaks.", slug: cluster}
    - {code: G44.031, title: "Episodic paroxysmal hemicrania, intractable", plain: "Short, frequent one-sided attacks in bouts, hard to treat.", slug: other-tacs}
    - {code: G44.039, title: "Episodic paroxysmal hemicrania, not intractable", plain: "Short, frequent one-sided attacks in bouts.", slug: other-tacs}
    - {code: G44.041, title: "Chronic paroxysmal hemicrania, intractable", plain: "Short, frequent one-sided attacks without long breaks, hard to treat.", slug: other-tacs}
    - {code: G44.049, title: "Chronic paroxysmal hemicrania, not intractable", plain: "Short, frequent one-sided attacks without long breaks.", slug: other-tacs}
    - {code: G44.051, title: "Short lasting unilateral neuralgiform headache with conjunctival injection and tearing (SUNCT), intractable", plain: "Seconds-long stabbing attacks around one eye with a red, watery eye, hard to treat.", slug: other-tacs}
    - {code: G44.059, title: "Short lasting unilateral neuralgiform headache with conjunctival injection and tearing (SUNCT), not intractable", plain: "Seconds-long stabbing attacks around one eye with a red, watery eye.", slug: other-tacs}
    - {code: G44.091, title: "Other trigeminal autonomic cephalgias (TAC), intractable", plain: "Another headache in the cluster family, hard to treat.", slug: other-tacs}
    - {code: G44.099, title: "Other trigeminal autonomic cephalgias (TAC), not intractable", plain: "Another headache in the cluster family.", slug: other-tacs}
